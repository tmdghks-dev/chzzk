# 앱(Windows .exe / macOS .dmg / Android .apk)을 빌드해서 GitHub Release 하나에 같이 올린다.
# 실행: v1.1.0 같은 태그를 push 하거나, Actions 탭에서 직접 실행
name: apps

on:
  push:
    tags: ["v*", "desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'apps-latest' }}

jobs:
  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 치지직 앱 ${{ env.RELEASE_TAG }}
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci && npx cap sync android
      - name: 서명 키 복원
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: APK 빌드
        working-directory: mobile/android
        env:
          CHZZK_KEYSTORE: ${{ runner.temp }}/release.jks
          CHZZK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../chzzk-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: 치지직 앱 ${{ env.RELEASE_TAG }}
          files: mobile/chzzk-android.apk
