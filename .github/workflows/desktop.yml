# 데스크톱 앱(Windows .exe / macOS .dmg)을 빌드해서 GitHub Release에 올린다.
# 실행: desktop-v1.0.0 같은 태그를 push 하거나, Actions 탭에서 직접 실행
name: desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'desktop-latest' }}
          name: 치지직 데스크톱 앱
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
