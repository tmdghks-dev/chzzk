# 서버의 /etc/turnserver.conf (coturn). 셀룰러(통신사 NAT)에서 라이브 영상을 중계한다.
# <PRIVATE_IP>: `hostname -I`의 첫 번째 값, <PUBLIC_IP>: OCI 공인 IP
# <TURN_SECRET>: `openssl rand -hex 24`로 만든 값. 같은 값을 백엔드 환경변수 TURN_SECRET에 넣는다 (저장소에는 넣지 않음)
listening-port=3478
listening-ip=<PRIVATE_IP>
relay-ip=<PRIVATE_IP>
external-ip=<PUBLIC_IP>/<PRIVATE_IP>
min-port=49160
max-port=49200
realm=tmdghks.dev
use-auth-secret
static-auth-secret=<TURN_SECRET>
fingerprint
no-tls
no-dtls
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
total-quota=100
log-file=syslog
