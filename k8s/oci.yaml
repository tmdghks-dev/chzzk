# 7단계: OCI 서버(K3s)용 배포
#  - chzzk       : 일반 페이지(목록·다시보기·로그인·후원). HPA로 2~5개 자동 확장
#  - chzzk-live  : 라이브 시그널링(/ws/live) 전용 1개
#    시그널링 상태(방송자·시청자 웹소켓)가 파드 메모리에 있어서, 방송자와 시청자가 같은 파드에 붙어야 한다.
#    그래서 cloudflared가 /ws/ 요청만 이 파드로 보낸다.
#    ponytail: 라이브 시그널링은 파드 1개. 동시 방송이 많아지면 Redis pub/sub 등으로 파드 간 메시지 공유
# 적용 전 준비: postgres.yaml, Secret chzzk-secrets(DB_PASSWORD, TOSS_*, TURN_SECRET), 이미지 chzzk:local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chzzk
spec:
  replicas: 2
  selector:
    matchLabels: { app: chzzk }
  template:
    metadata:
      labels: { app: chzzk }
    spec:
      containers:
        - name: chzzk
          image: chzzk:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: cluster }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/chzzk" }
            - { name: DB_USERNAME, value: chzzk }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: chzzk-secrets, key: DB_PASSWORD } }
            - name: TOSS_CLIENT_KEY
              valueFrom: { secretKeyRef: { name: chzzk-secrets, key: TOSS_CLIENT_KEY, optional: true } }
            - name: TOSS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: chzzk-secrets, key: TOSS_SECRET_KEY, optional: true } }
            - { name: TURN_URL, value: "turn:129.221.216.69:3478" }
            - name: TURN_SECRET
              valueFrom: { secretKeyRef: { name: chzzk-secrets, key: TURN_SECRET, optional: true } }
          resources:
            requests: { cpu: 250m, memory: 384Mi }   # HPA는 이 요청량 대비 사용률(%)을 본다
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chzzk-live
spec:
  replicas: 1
  selector:
    matchLabels: { app: chzzk-live }
  template:
    metadata:
      labels: { app: chzzk-live }
    spec:
      containers:
        - name: chzzk
          image: chzzk:local
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: cluster }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/chzzk" }
            - { name: DB_USERNAME, value: chzzk }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: chzzk-secrets, key: DB_PASSWORD } }
            - name: TOSS_CLIENT_KEY
              valueFrom: { secretKeyRef: { name: chzzk-secrets, key: TOSS_CLIENT_KEY, optional: true } }
            - name: TOSS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: chzzk-secrets, key: TOSS_SECRET_KEY, optional: true } }
            - { name: TURN_URL, value: "turn:129.221.216.69:3478" }
            - name: TURN_SECRET
              valueFrom: { secretKeyRef: { name: chzzk-secrets, key: TURN_SECRET, optional: true } }
          resources:
            requests: { cpu: 250m, memory: 384Mi }   # HPA는 이 요청량 대비 사용률(%)을 본다
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chzzk
spec:
  type: NodePort
  selector: { app: chzzk }   # 준비된 chzzk 파드들에 요청을 나눠 보낸다
  ports:
    - { port: 80, targetPort: 8080, nodePort: 30080 }
---
apiVersion: v1
kind: Service
metadata:
  name: chzzk-live
spec:
  type: NodePort
  selector: { app: chzzk-live }
  ports:
    - { port: 80, targetPort: 8080, nodePort: 30081 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chzzk
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: chzzk }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }   # 평균 CPU가 요청량의 50%를 넘으면 늘린다
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # 부하가 멈추고 1분간 낮으면 줄인다
