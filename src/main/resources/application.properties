spring.application.name=chzzk

spring.datasource.url = jdbc:h2:file:./data/chzzk
spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true
spring.h2.console.enabled = false
server.port = 8091
toss.client-key=${TOSS_CLIENT_KEY:}
toss.secret-key=${TOSS_SECRET_KEY:}
spring.config.import=optional:classpath:application-secret.properties
# 5단계: 로그인 세션을 서버 메모리 대신 DB(SPRING_SESSION 테이블)에 저장해 여러 인스턴스가 함께 쓴다
spring.session.jdbc.initialize-schema=always
management.endpoints.web.exposure.include=health
