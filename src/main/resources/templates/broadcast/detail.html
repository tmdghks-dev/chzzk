<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${broadcast.title}">방송</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<header th:replace="~{fragments/top :: top}"></header>
<main class="wrap">
    <h1 th:text="${broadcast.title}">제목</h1>
    <div class="split">
        <div>
            <video class="player contain" th:src="${broadcast.videoPath}" controls playsinline></video>
            <div class="bar">
                <span class="pill" th:if="${broadcast.owner}" th:text="'방송자 ' + ${broadcast.owner.username}"></span>
                <form th:if="${broadcast.owner != null and session.memberId == broadcast.owner.id}"
                      method="post" th:action="@{/broadcasts/{id}/delete(id=${broadcast.id})}">
                    <button class="ghost">방송 삭제</button>
                </form>
            </div>
        </div>

        <aside class="card">
            <h2 style="margin-top:0">💰 후원 <span class="total" th:text="${#numbers.formatInteger(donationTotal, 0, 'COMMA')} + '원'"></span></h2>
            <form class="row" th:if="${session.memberId != null and broadcast.owner != null}"
                  method="post" th:action="@{/broadcasts/{id}/donations(id=${broadcast.id})}">
                <input name="amount" type="number" min="1000" step="1000" value="1000" required>
                <button>후원</button>
            </form>
            <ul class="list" style="margin-top:12px">
                <li th:each="d : ${donations}">
                    <b th:text="${d.donor.username}">후원자</b>님
                    <span class="total" th:text="${#numbers.formatInteger(d.amount, 0, 'COMMA')} + '원'">금액</span>
                </li>
            </ul>

            <h2>댓글</h2>
            <ul class="list">
                <li th:each="c : ${comments}"><b th:text="${c.author.username}">작성자</b> <span th:text="${c.content}">내용</span></li>
            </ul>
            <form class="row" style="margin-top:12px" th:if="${session.memberId}" method="post"
                  th:action="@{/broadcasts/{id}/comments(id=${broadcast.id})}">
                <input name="content" placeholder="댓글 쓰기" required>
                <button>등록</button>
            </form>
            <p class="muted" th:unless="${session.memberId}"><a href="/login">로그인</a>하면 후원하고 댓글을 쓸 수 있어요</p>
        </aside>
    </div>
</main>
</body>
</html>
