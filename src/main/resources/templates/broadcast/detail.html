<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title th:text="${broadcast.title}">방송</title></head>
<body>
<a href="/broadcasts">← 목록</a>
<h1 th:text="${broadcast.title}">제목</h1>
<p th:if="${broadcast.owner}" th:text="'방송자: ' + ${broadcast.owner.username}"></p>
<video th:src="${broadcast.videoPath}" controls width="640"></video>

<form th:if="${broadcast.owner != null and session.memberId == broadcast.owner.id}"
      method="post" th:action="@{/broadcasts/{id}/delete(id=${broadcast.id})}">
    <button>방송 삭제</button>
</form>

<h2>댓글</h2>
<ul>
    <li th:each="c : ${comments}">
        <b th:text="${c.author.username}">작성자</b>: <span th:text="${c.content}">내용</span>
    </li>
</ul>
<form th:if="${session.memberId}" method="post" th:action="@{/broadcasts/{id}/comments(id=${broadcast.id})}">
    <input name="content" placeholder="댓글 쓰기" required>
    <button>등록</button>
</form>
<p th:unless="${session.memberId}"><a href="/login">로그인</a>하면 댓글을 쓸 수 있어요</p>
</body>
</html>
