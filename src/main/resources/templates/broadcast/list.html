<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>치지직</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<header th:replace="~{fragments/top :: top}"></header>
<main class="wrap">
    <div class="head"><h1>라이브</h1></div>
    <div class="grid">
        <a th:each="l : ${lives.?[onAir]}" class="tile" th:href="@{/lives/{id}(id=${l.id})}">
            <div class="thumb">
                <span class="badge">LIVE</span>
                <span class="ico">📡</span>
            </div>
            <div class="t" th:text="${l.title}">제목</div>
        </a>
    </div>
    <p class="empty" th:if="${lives.?[onAir].isEmpty()}">지금 방송 중인 라이브가 없어요. 오른쪽 위 <b>● 라이브</b>로 첫 방송을 켜 보세요.</p>

    <div class="head"><h2>다시보기</h2><a class="btn ghost" href="/broadcasts/new">+ 영상 등록</a></div>
    <div class="grid">
        <a th:each="b : ${broadcasts}" class="tile" th:href="@{/broadcasts/{id}(id=${b.id})}">
            <div class="thumb"><video th:src="${b.videoPath} + '#t=1'" preload="metadata" muted playsinline></video></div>
            <div class="t" th:text="${b.title}">제목</div>
        </a>
    </div>
    <p class="empty" th:if="${#lists.isEmpty(broadcasts)}">등록된 영상이 없어요.</p>
</main>
</body>
</html>
